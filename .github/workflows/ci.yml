name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify FFmpeg and DejaVu fonts (install only if missing)
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null || \
             ! command -v fc-match >/dev/null || ! fc-match 'DejaVu Sans' | grep -qi 'DejaVu'; then
            # The ephemeral GitHub image can contain unrelated vendor APT
            # repositories. Their 403 must not block Ubuntu package installs.
            for source in /etc/apt/sources.list.d/*; do
              if [ -f "$source" ] && grep -q 'packages.microsoft.com' "$source"; then
                sudo mv "$source" "$source.disabled"
              fi
            done
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core fontconfig
          fi
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -hide_banner -version | head -n 1
          fc-match 'DejaVu Sans' | grep -qi 'DejaVu'
      - name: Install package and tests
        run: pip install -e . pytest==9.1.1
      - name: Run standalone Social Media Studio system audit
        run: |
          audit_status=0
          sms-studio system-audit --repo-root . > /tmp/standalone-social-media-studio-system-audit.json || audit_status=$?
          SMS_AUDIT_EXIT="$audit_status" python - <<'PY'
          import json
          import os
          report = json.load(open('/tmp/standalone-social-media-studio-system-audit.json', encoding='utf-8'))
          if int(os.environ["SMS_AUDIT_EXIT"]) != 0 or report['pass'] is not True:
              print(json.dumps(report, indent=2, ensure_ascii=False))
              raise SystemExit('standalone Social Media Studio system audit failed')
          assert report['structural_status'] == 'PASS', report
          assert report['production_readiness'] == 'PARTIAL', report
          assert report['boundary']['caos_session_governance_required'] is True, report
          assert report['boundary']['caos_runtime_dependency'] is False, report
          assert report['boundary']['caos_source_mutation_allowed'] is False, report
          assert report['boundary']['paid_provider_calls_made'] is False, report
          assert report['capability_gaps'], report
          print('standalone-social-media-studio-system-audit: PASS')
          PY
      - name: Inspect every internal Social Media Studio subsystem and tracked source
        run: |
          sms-studio subsystems --repo-root . > /tmp/content-subsystems.json
          python - <<'PY'
          import json
          report = json.load(open('/tmp/content-subsystems.json', encoding='utf-8'))
          catalog = json.load(open("social_media_studio/data/subsystem_catalog.json", encoding="utf-8"))
          floors = catalog["topology_contract"]
          assert report["pass"], report["violations"]
          assert report["all_tracked_bytes_inspected"] is True
          assert report["code_modules"] == report["owned_modules"]
          assert report["code_modules"] >= floors["minimum_code_modules"]
          assert report["subsystems"] >= floors["minimum_subsystems"]
          assert report["domain_adapters"] >= floors["minimum_domain_adapters"]
          assert report["production_operations"] >= floors["minimum_production_operations"]
          from social_media_studio.production.registry import PRODUCTION_EXECUTORS
          assert report["production_operations"] == len(PRODUCTION_EXECUTORS.operations())
          assert report["real_creative_quality_verified"] is False
          assert report["native_caos_selection_verified"] is False
          print("complete-source-topology-structural-audit: PASS")
          PY
      - name: Run tests
        run: pytest -q
      - name: Smoke test standalone outcome-driven Social Media Studio
        run: |
          sms-studio --help > /tmp/sms-studio-help.txt
          test -s /tmp/sms-studio-help.txt
          studio_root="$(mktemp -d)"
          sms-studio --offline-fixture --root "$studio_root" init smoke-episode --title "Standalone Studio smoke" --brief examples/technology-explainer.brief.json > /tmp/studio-init.json
          sms-studio --offline-fixture --root "$studio_root" plan smoke-episode examples/technology-explainer.tasks.json > /tmp/studio-plan.json
          sms-studio --offline-fixture --root "$studio_root" status smoke-episode > /tmp/studio-status.json
          sms-studio --offline-fixture --root "$studio_root" audit smoke-episode > /tmp/studio-audit.json
          python - <<'PY'
          import json
          status = json.load(open('/tmp/studio-status.json', encoding='utf-8'))
          audit = json.load(open('/tmp/studio-audit.json', encoding='utf-8'))
          assert set(status['ready_tasks']) == {'research', 'creative-directions'}, status
          assert audit['pass'] is True, audit
          assert audit['task_count'] == 13, audit
          print('standalone-social-media-studio-smoke: PASS')
          PY
      - name: "Regression fixture: historical Program context and parallel readiness"
        run: |
          program_root="$(mktemp -d)"
          sms-studio --offline-fixture --root "$program_root" init ai-self-media-commercialization --title "Integrated Program smoke" --brief examples/ai-self-media-commercialization.brief.json > /tmp/program-init.json
          sms-studio --offline-fixture --root "$program_root" import-manifest ai-self-media-commercialization examples/ai-self-media-commercialization.context.json > /tmp/program-context-import.json
          sms-studio --offline-fixture --root "$program_root" plan ai-self-media-commercialization examples/ai-self-media-commercialization.tasks.json > /tmp/program-plan.json
          sms-studio --offline-fixture --root "$program_root" status ai-self-media-commercialization > /tmp/program-status.json
          sms-studio --offline-fixture --root "$program_root" tasks ai-self-media-commercialization > /tmp/program-tasks.json
          sms-studio --offline-fixture --root "$program_root" audit ai-self-media-commercialization > /tmp/program-audit.json
          python - <<'PY'
          import json
          status = json.load(open('/tmp/program-status.json', encoding='utf-8'))
          tasks = json.load(open('/tmp/program-tasks.json', encoding='utf-8'))
          audit = json.load(open('/tmp/program-audit.json', encoding='utf-8'))
          task_map = {item['task_id']: item for item in tasks}
          assert len(tasks) == 50, len(tasks)
          assert task_map['growth-baseline-and-topic-hypotheses']['status'] == 'READY', task_map['growth-baseline-and-topic-hypotheses']
          assert task_map['commercial-advertiser-map']['status'] == 'READY', task_map['commercial-advertiser-map']
          assert task_map['production-economics-baseline']['status'] == 'READY', task_map['production-economics-baseline']
          assert task_map['provider-capability-benchmark']['status'] == 'READY', task_map['provider-capability-benchmark']
          assert task_map['jensen-case-fact-audit']['status'] == 'READY', task_map['jensen-case-fact-audit']
          assert task_map['jensen-source-media-inspection']['status'] == 'WAITING_INPUT', task_map['jensen-source-media-inspection']
          assert task_map['jensen-rights-identity-audit']['status'] == 'WAITING_INPUT', task_map['jensen-rights-identity-audit']
          assert task_map['ipos-video-identity-bundle-import']['status'] == 'PENDING', task_map['ipos-video-identity-bundle-import']
          assert status['task_counts']['READY'] >= 6, status
          assert audit['pass'] is True, audit
          print('historical-program-regression-fixture: PASS')
          PY
      - name: Smoke test installed Social Media Studio outside repository
        run: |
          cd /tmp
          sms-studio --help > /tmp/sms-studio-outside-repo.txt
          python -m social_media_studio --help > /tmp/social-media-studio-module-help.txt
          studio_root="$(mktemp -d)"
          sms-studio --offline-fixture --root "$studio_root" init outside-repo-smoke --title "Installed Social Media Studio smoke" --brief "$GITHUB_WORKSPACE/examples/technology-explainer.brief.json" > /tmp/standalone-init.json
          sms-studio --offline-fixture --root "$studio_root" plan outside-repo-smoke "$GITHUB_WORKSPACE/examples/technology-explainer.tasks.json" > /tmp/standalone-plan.json
          sms-studio --offline-fixture --root "$studio_root" audit outside-repo-smoke > /tmp/standalone-audit.json
          python - <<'PY'
          import json
          import sys
          import social_media_studio
          import social_media_studio.adapters
          from social_media_studio.engine import StudioEngine

          assert social_media_studio.StudioEngine is StudioEngine
          blocked = {
              "social_media_studio.legacy.runtime",
              "social_media_studio.legacy.orchestrator",
              "social_media_studio.legacy.studio_agents",
              "social_media_studio.legacy.storage",
          }
          assert not blocked.intersection(sys.modules)
          report = json.load(open('/tmp/standalone-audit.json', encoding='utf-8'))
          assert report['pass'] is True, report
          assert report['task_count'] == 13, report
          print('installed-social-media-studio-outside-repo: PASS')
          PY
