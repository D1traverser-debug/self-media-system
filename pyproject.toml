[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
dependencies = ["Pillow>=10.0", "filelock>=3.13", "cryptography>=42.0"]
name = "social-media-studio"
version = "2.0.0"
description = "CAOS-governed Social Media Studio for multilingual writing, platform packaging, visual and identity craft, media transformation and original video"
requires-python = ">=3.11"

[project.scripts]
sms-studio = "social_media_studio.cli:main"

[tool.setuptools.packages.find]
include = ["social_media_studio*"]
exclude = ["tests*", "skills*", "projects*"]

[tool.setuptools.package-data]
"social_media_studio.legacy" = ["data/*.json", "data/*.md"]
"social_media_studio" = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
