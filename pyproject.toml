[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
dependencies = ["Pillow>=10.0", "filelock>=3.13"]
name = "video-growth-agent"
version = "1.0.0"
description = "CAOS-governed universal content studio for multilingual writing, platform packaging, visual and identity craft, media transformation and original video"
requires-python = ">=3.11"

[project.scripts]
vga-studio = "video_studio.cli:main"

[tool.setuptools.packages.find]
include = ["video_growth_agent*", "video_studio*"]
exclude = ["tests*", "skills*", "projects*"]

[tool.setuptools.package-data]
video_growth_agent = ["data/*.json", "data/*.md"]
video_studio = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
